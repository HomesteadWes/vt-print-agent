name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Vet + build the Windows target (pure Go). Vetting the linux build would
      # need GTK dev headers for the tray dep, which we don't install here.
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null .
